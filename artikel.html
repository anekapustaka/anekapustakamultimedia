<main class="container my-5">
  <div class="d-flex flex-lg-row flex-column gap-4">

    <article class="flex-fill">

      <img
        id="article-banner"
        class="article-banner"
        src=""
        alt="Banner Artikel"

      >

    </article>

    <aside class="sidebar flex-shrink-0"

<script src="script/data-artikel.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  const article = (typeof articles !== "undefined" && id !== null)
    ? articles[id]
    : null;

  const titleEl = document.getElementById("article-title");
  const bannerEl = document.getElementById("article-banner");
  const metaEl = document.getElementById("article-meta");
  const contentEl = document.getElementById("article-content");

  if (!article) {
    titleEl.textContent = "Artikel Tidak Ditemukan";
    metaEl.textContent = "";
    contentEl.innerHTML = `
      <p>Artikel dengan ID "${id || "-"}" tidak ditemukan.</p>
      <p><a href="artikel-all.html">Kembali ke daftar artikel</a></p>
    `;
    bannerEl.style.display = "none";
    return;
  }

  document.title = article.title + " - Aneka Pustaka Multimedia";

  titleEl.textContent = article.title;
  metaEl.textContent = `${article.date || ""} - ${article.author || ""}`;
  contentEl.innerHTML = article.content || "";

  if (article.banner) {
    bannerEl.src = article.banner;
    bannerEl.alt = article.title;
    bannerEl.style.display = "block";
    bannerEl.onerror = function () {
      this.style.display = "none";
    };
  } else {
    bannerEl.style.display = "none";
  }

  const description = document.getElementById("meta-description");
  const keywords = document.getElementById("meta-keywords");

  if (description) {
    description.content = article.description || "";
  }

  if (keywords) {
    keywords.content = article.keywords || "";
  }

  const relatedContainer = document.getElementById("related-articles");

  if (relatedContainer) {
    relatedContainer.innerHTML = "";

    Object.keys(articles)
      .filter(key => key !== id)
      .slice(0, 5)
      .forEach(key => {
        const link = document.createElement("a");
        link.href = `artikel.html?id=${encodeURIComponent(key)}`;
        link.textContent = articles[key].title;
        relatedContainer.appendChild(link);
      });
  }
});
</script>

</body>
