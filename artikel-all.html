<main class="container my-5">
  <div class="judul">
    <h2>Artikel</h2>
    <p>Informasi, wawasan, dan inspirasi dari Aneka Pustaka Multimedia.</p>
  </div>

  <div id="artikel-grid" class="artikel-grid"></div>
</main>

<script src="script/data-artikel.js"></script>

<script>
  const grid = document.getElementById("artikel-grid");

  const dataArtikel =
    typeof articles !== "undefined" && articles
      ? articles
      : {};

  const keys = Object.keys(dataArtikel);

  if (keys.length === 0) {
    grid.innerHTML = `
      <p class="artikel-kosong">
        Belum ada artikel yang tersedia.
      </p>
    `;
  } else {
    keys.forEach(key => {
      const article = dataArtikel[key];

      const card = document.createElement("article");
      card.className = "artikel-card";

      const image = document.createElement("img");
      image.src = article.banner || "images/logocv.png";
      image.alt = article.title || "Artikel Aneka Pustaka Multimedia";
      image.loading = "lazy";

      image.onerror = function () {
        this.onerror = null;
        this.src = "images/logocv.png";
      };

      const body = document.createElement("div");
      body.className = "artikel-card-body";

      const title = document.createElement("h5");
      title.className = "artikel-card-title";
      title.textContent = article.title || "Tanpa Judul";

      const excerpt = document.createElement("p");
      excerpt.className = "artikel-card-excerpt";
      excerpt.textContent =
        article.excerpt ||
        article.description ||
        "Baca artikel ini untuk mengetahui informasi selengkapnya.";

      const link = document.createElement("a");
      link.href = `artikel.html?id=${encodeURIComponent(key)}`;
      link.className = "btn-baca";
      link.textContent = "Baca Selengkapnya";

      body.appendChild(title);
      body.appendChild(excerpt);
      body.appendChild(link);

      card.appendChild(image);
      card.appendChild(body);

      grid.appendChild(card);
    });
  }
</script>

  <script src="script/data-artikel.js"></script>
  <script>
    const grid = document.getElementById("artikel-grid");
    const keys = Object.keys(articles);

    keys.forEach(key => {
      const article = articles[key];

      const card = document.createElement("div");
      card.classList.add("artikel-card");

      card.innerHTML = `
        <img src="${article.banner}" alt="${article.title}">
        <div class="artikel-card-body">
          <h5 class="artikel-card-title">${article.title}</h5>
          <p class="artikel-card-excerpt">${article.excerpt}</p>
          <a href="artikel.html?id=${key}" class="btn-baca">Baca Selengkapnya</a>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>
</body>
